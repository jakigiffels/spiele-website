<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        #game-container {
            margin: 20px auto;
            width: 400px;
            height: 400px;
            border: 1px solid #333;
            background-color: #000;
            position: relative;
        }
        #score {
            font-size: 24px;
            margin: 10px;
        }
        #controls {
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Snake</h1>
    <div id="score">Punkte: 0</div>
    <div id="game-container"></div>
    <div id="controls">
        <button id="start-button">Start</button>
        <button id="reset-button">Reset</button>
    </div>
    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const startButton = document.getElementById('start-button');
        const resetButton = document.getElementById('reset-button');

        let snake = [{ x: 200, y: 200 }];
        let food = { x: 0, y: 0 };
        let direction = 'right';
        let score = 0;
        let gameInterval;

        function createFood() {
            food = {
                x: Math.floor(Math.random() * 40) * 10,
                y: Math.floor(Math.random() * 40) * 10
            };
        }

        function draw() {
            gameContainer.innerHTML = '';

            // Zeichne die Schlange
            snake.forEach(segment => {
                const segmentElement = document.createElement('div');
                segmentElement.style.position = 'absolute';
                segmentElement.style.width = '10px';
                segmentElement.style.height = '10px';
                segmentElement.style.backgroundColor = 'lime';
                segmentElement.style.left = segment.x + 'px';
                segmentElement.style.top = segment.y + 'px';
                gameContainer.appendChild(segmentElement);
            });

            // Zeichne das Essen
            const foodElement = document.createElement('div');
            foodElement.style.position = 'absolute';
            foodElement.style.width = '10px';
            foodElement.style.height = '10px';
            foodElement.style.backgroundColor = 'red';
            foodElement.style.left = food.x + 'px';
            foodElement.style.top = food.y + 'px';
            gameContainer.appendChild(foodElement);
        }

        function update() {
            const head = { ...snake[0] };

            // Bewege den Kopf der Schlange
            switch (direction) {
                case 'up':
                    head.y -= 10;
                    break;
                case 'down':
                    head.y += 10;
                    break;
                case 'left':
                    head.x -= 10;
                    break;
                case 'right':
                    head.x += 10;
                    break;
            }

            // Überprüfe, ob die Schlange das Essen gefressen hat
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = `Punkte: ${score}`;
                createFood();
            } else {
                snake.pop();
            }

            // Füge den neuen Kopf hinzu
            snake.unshift(head);

            // Überprüfe auf Kollision mit den Wänden
            if (
                head.x < 0 ||
                head.x >= gameContainer.clientWidth ||
                head.y < 0 ||
                head.y >= gameContainer.clientHeight
            ) {
                clearInterval(gameInterval);
                alert('Game Over!');
            }

            // Überprüfe auf Kollision mit dem eigenen Körper
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    clearInterval(gameInterval);
                    alert('Game Over!');
                }
            }
        }

        function startGame() {
            snake = [{ x: 200, y: 200 }];
            direction = 'right';
            score = 0;
            scoreElement.textContent = `Punkte: ${score}`;
            createFood();
            gameInterval = setInterval(() => {
                update();
                draw();
            }, 100);
        }

        startButton.addEventListener('click', startGame);

        resetButton.addEventListener('click', () => {
            clearInterval(gameInterval);
            startGame();
        });

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    if (direction !== 'down') direction = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') direction = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') direction = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') direction = 'right';
                    break;
            }
        });
    </script>
</body>
</html>
