<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiele-Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        main {
            padding: 20px;
            text-align: center;
        }
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .game-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .game-card h3 {
            margin-top: 0;
        }
        .game-card a {
            display: block;
            margin-top: 10px;
            color: #333;
            text-decoration: none;
            background-color: #f0f0f0;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Spiele-Website</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Arcade</a>
        <a href="#">Puzzle</a>
        <a href="#">Action</a>
    </nav>
    <main>
        <h2>Willkommen auf der Spiele-Website</h2>
        <p>Wähle ein Spiel aus, um zu beginnen:</p>
        <div class="game-container">
            <div class="game-card">
                <h3>Snake</h3>
                <a href="snake.html">Spiel starten</a>
            </div>
            <div class="game-card">
                <h3>Tic-Tac-Toe</h3>
                <a href="tictactoe.html">Spiel starten</a>
            </div>
            <div class="game-card">
                <h3>Memory</h3>
                <a href="memory.html">Spiel starten</a>
            </div>
        </div>
    </main>
</body>
</html>
